[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    hardware: marks tests requiring physical ESP32-S3 hardware
    model: marks tests requiring TFLite model artifact in ml/models/int8/
addopts = -v --tb=short --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:tensorflow.*
