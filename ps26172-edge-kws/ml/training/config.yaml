audio:
  sample_rate: 16000
  clip_duration_s: 1.0
  frame_length_ms: 30
  frame_stride_ms: 10

mfcc:
  num_coeffs: 40
  num_frames: 49
  num_mels: 40

model:
  embedding_dim: 64
  dropout: 0.1

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  val_split: 0.15
  seed: 42
  n_shot: 10
  n_way: 5
  n_episodes: 500

quantization:
  representative_samples: 200

paths:
  speech_commands_url: "https://storage.googleapis.com/download.tensorflow.org/data/speech_commands_v0.02.tar.gz"
  processed_dir: "ml/datasets/processed"
  checkpoint_dir: "ml/models/checkpoints"
  exported_dir: "ml/models/exported"
  int8_dir: "ml/models/int8"

inference:
  similarity_threshold: 0.75
  debounce_hits: 2
  debounce_window: 3
